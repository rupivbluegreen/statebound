# Build and deploy the MkDocs Material site to GitHub Pages on every
# push to main. The site source is the docs/ directory + mkdocs.yml at
# the repo root.
name: Deploy docs site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Pages writes need explicit permissions; everything else stays
# read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight Pages deployment at a time. Cancel queued runs so the
# latest commit always wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install MkDocs Material
        run: |
          pip install --upgrade pip
          pip install \
            mkdocs-material==9.5.39 \
            mkdocs-material-extensions==1.3.1 \
            pymdown-extensions==10.11.2

      - name: Build site
        run: mkdocs build --strict --site-dir _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
